# mosquitto 配置 —— 苹果皮项目 MQTT broker
# 用于开发期(本地或 VPS)。生产环境建议加 TLS(8883 端口)。
#
# 部署:
#   1. 安装 mosquitto: Ubuntu/Debian `apt install mosquitto`,或 Docker
#   2. 生成密码文件: mosquitto_passwd -c /etc/mosquitto/passwd applecase
#      (会提示输入密码,设为 change-me)
#   3. 复制本配置到 /etc/mosquitto/conf.d/applecase.conf
#   4. 重启: systemctl restart mosquitto
#
# 也可 Docker 一键跑(开发用):
#   docker run -d --name mqtt -p 1883:1883 -v $PWD/mosquitto.conf:/mosquitto/config/mosquitto.conf \
#     -v $PWD/passwd:/mosquitto/config/passwd eclipse-mosquitto

# 监听端口(走 ZeroTier 网络的话,broker 监听 ZeroTier IP 更安全)
listener 1883

# 允许匿名(false = 必须账号密码)
allow_anonymous false

# 密码文件路径(需用 mosquitto_passwd 生成)
password_file /etc/mosquitto/passwd
# Docker 用: password_file /mosquitto/config/passwd

# 日志
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp true

# 持久化(重启不丢 retained 消息)
persistence true
persistence_location /var/lib/mosquitto/

# 协议设置
max_keepalive 120
max_inflight_messages 20
